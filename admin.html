<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GAMBIT JIUJITSU Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f2f4f6;
      color: #181818;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 20px;
      padding: 22px;
      background: #111111;
      color: #ffffff;
      border-radius: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 8px 0 0;
      color: #d6d6d6;
    }

    .card {
      margin-bottom: 18px;
      padding: 20px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .login-card {
      max-width: 440px;
      margin: 50px auto;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 16px;
    }

    input,
    select {
      border: 1px solid #cccccc;
      background: #ffffff;
    }

    button {
      border: 0;
      background: #111111;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .login-button {
      margin-top: 14px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: end;
      margin-bottom: 18px;
    }

    .toolbar > div {
      flex: 1;
    }

    .refresh-button {
      width: auto;
      min-width: 130px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary-box {
      padding: 16px;
      background: #ffffff;
      border-radius: 14px;
      text-align: center;
    }

    .summary-number {
      display: block;
      margin-bottom: 5px;
      font-size: 28px;
      font-weight: bold;
    }

    .session-title {
      margin: 0 0 5px;
      font-size: 21px;
    }

    .session-time {
      margin: 0;
      color: #666666;
    }

    .member-list {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .member-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: #f7f7f7;
      border-radius: 12px;
    }

    .member-name {
      margin: 0;
      font-weight: bold;
    }

    .member-detail {
      margin: 5px 0 0;
      color: #777777;
      font-size: 13px;
    }
.teacher-checkin-button {
  width: auto;
  min-height: 38px;
  padding: 8px 12px;
  background: #111111;
  font-size: 14px;
  white-space: nowrap;
}

.teacher-checkin-button:disabled {
  opacity: 0.55;
}

.status-area {
  flex-shrink: 0;
  text-align: right;
}
    .status-badge {
      flex-shrink: 0;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
    }

    .checked {
      background: #e5f8eb;
      color: #087b32;
    }

    .not-checked {
      background: #fff0f0;
      color: #b42318;
    }

    .method {
      margin-top: 4px;
      font-size: 12px;
      color: #666666;
    }

    .empty {
      padding: 25px;
      color: #777777;
      text-align: center;
    }

    .error {
      margin-top: 14px;
      color: #c62828;
      white-space: pre-line;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #666666;
    }

    .logout-button {
      width: auto;
      margin-top: 14px;
      padding: 8px 14px;
      min-height: 38px;
      background: #ffffff;
      color: #111111;
    }

    #adminArea {
      display: none;
    }

    @media (max-width: 650px) {
      .toolbar {
        display: block;
      }

      .toolbar > div,
      .refresh-button {
        width: 100%;
        margin-bottom: 12px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .member-row {
        align-items: flex-start;
      }
    }
 .member-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 8px;
}

.change-belt-button {
  width: auto;
  min-height: 34px;
  padding: 7px 11px;
  border: 1px solid #cccccc;
  background: #ffffff;
  color: #111111;
  font-size: 13px;
}

.belt-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 5px;
  padding: 5px 9px;
  border: 1px solid #dddddd;
  border-radius: 999px;
  font-size: 13px;
  font-weight: bold;
}

.belt-color {
  width: 16px;
  height: 16px;
  border: 1px solid #999999;
  border-radius: 4px;
}

.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  padding: 20px;
  background: rgba(0, 0, 0, 0.55);
  align-items: center;
  justify-content: center;
}

.modal-backdrop.open {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 470px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 22px;
  background: #ffffff;
  border-radius: 18px;
}

.modal h2 {
  margin-top: 0;
}

.form-group {
  margin-bottom: 16px;
}

.modal-actions {
  display: flex;
  gap: 10px;
}

.modal-actions button {
  flex: 1;
}

.cancel-button {
  border: 1px solid #cccccc;
  background: #ffffff;
  color: #111111;
}

.modal-error {
  min-height: 20px;
  color: #c62828;
  white-space: pre-line;
}

textarea {
  width: 100%;
  min-height: 90px;
  padding: 11px 13px;
  border: 1px solid #cccccc;
  border-radius: 10px;
  font: inherit;
  resize: vertical;
}
  </style>
</head>

<body>
  <main class="container">
    <section id="loginArea" class="card login-card">
      <h1>🔐 หน้า Admin</h1>
      <p>กรอกรหัสสำหรับคุณครูเพื่อดูรายชื่อเข้าเรียน</p>

      <label for="adminKey">รหัส Admin</label>

      <input
        id="adminKey"
        type="password"
        autocomplete="current-password"
        placeholder="กรอกรหัส Admin"
      >

      <button
        id="loginButton"
        class="login-button"
        type="button"
      >
        เข้าสู่ระบบ
      </button>

      <p id="loginError" class="error"></p>
    </section>

    <section id="adminArea">
      <header class="header">
        <h1>🥋 GAMBIT JIUJITSU</h1>
        <p id="dateText">ระบบตรวจสอบรายชื่อเข้าเรียน</p>

        <button
          id="logoutButton"
          class="logout-button"
          type="button"
        >
          ออกจากระบบ
        </button>
      </header>
<section class="card">
  <h2 style="margin-top: 0;">➕ เปิดคลาสวันนี้</h2>

  <div class="toolbar">
    <div>
      <label for="newClassSelect">ประเภทคลาส</label>
      <select id="newClassSelect"></select>
    </div>

    <div>
      <label for="newStartTime">เวลาเริ่ม</label>
      <input id="newStartTime" type="time" value="18:30">
    </div>

    <div>
      <label for="newEndTime">เวลาสิ้นสุด</label>
      <input id="newEndTime" type="time" value="20:30">
    </div>
  </div>

  <div class="form-group">
    <label for="newSessionNote">หมายเหตุ</label>
    <input
      id="newSessionNote"
      type="text"
      placeholder="เช่น Kids BJJ รอบเย็น"
    >
  </div>

  <button id="createSessionButton" type="button">
    เปิดคลาสวันนี้
  </button>

  <p id="createSessionError" class="error"></p>
</section>
      <section class="toolbar card">
        <div>
          <label for="sessionSelect">เลือกคลาส</label>
          <select id="sessionSelect"></select>
        </div>

        <button
          id="refreshButton"
          class="refresh-button"
          type="button"
        >
          🔄 โหลดข้อมูลใหม่
        </button>
      </section>

      <section class="summary">
        <div class="summary-box">
          <span id="totalCount" class="summary-number">0</span>
          สมาชิกทั้งหมด
        </div>

        <div class="summary-box">
          <span id="checkedCount" class="summary-number">0</span>
          เช็กชื่อแล้ว
        </div>

        <div class="summary-box">
          <span id="remainingCount" class="summary-number">0</span>
          ยังไม่เช็ก
        </div>
      </section>

      <section class="card">
        <h2 id="sessionTitle" class="session-title">
          ยังไม่ได้เลือกคลาส
        </h2>

        <p id="sessionTime" class="session-time"></p>

        <div id="content" class="loading">
          กำลังโหลดข้อมูล...
        </div>
      </section>
    </section>
  </main>
<section id="beltModal" class="modal-backdrop">
  <div class="modal">
    <h2>🥋 เปลี่ยนสาย</h2>

    <p id="beltMemberName"></p>

    <div class="form-group">
      <label for="beltLevelSelect">เลือกสายใหม่</label>
      <select id="beltLevelSelect"></select>
    </div>

    <div class="form-group">
      <label for="beltAwardedDate">วันที่ได้รับสาย</label>
      <input id="beltAwardedDate" type="date">
    </div>

    <div class="form-group">
      <label for="beltAwardedBy">ผู้มอบสาย</label>
      <input
        id="beltAwardedBy"
        type="text"
        placeholder="เช่น Coach, Kru Peter"
      >
    </div>

    <div class="form-group">
      <label for="beltNote">หมายเหตุ</label>
      <textarea
        id="beltNote"
        placeholder="เช่น ผ่านการทดสอบเลื่อนสาย"
      ></textarea>
    </div>

    <p id="beltModalError" class="modal-error"></p>

    <div class="modal-actions">
      <button
        id="cancelBeltButton"
        class="cancel-button"
        type="button"
      >
        ยกเลิก
      </button>

      <button id="saveBeltButton" type="button">
        บันทึกการเปลี่ยนสาย
      </button>
    </div>
  </div>
</section>
  <script>
    const newClassSelect =
  document.getElementById("newClassSelect");

const newStartTime =
  document.getElementById("newStartTime");

const newEndTime =
  document.getElementById("newEndTime");

const newSessionNote =
  document.getElementById("newSessionNote");

const createSessionButton =
  document.getElementById("createSessionButton");

const createSessionError =
  document.getElementById("createSessionError");
    const loginArea = document.getElementById("loginArea");
    const adminArea = document.getElementById("adminArea");
    const adminKeyInput = document.getElementById("adminKey");
    const loginButton = document.getElementById("loginButton");
    const loginError = document.getElementById("loginError");
    const logoutButton = document.getElementById("logoutButton");
    const refreshButton = document.getElementById("refreshButton");
    const sessionSelect = document.getElementById("sessionSelect");
    const content = document.getElementById("content");
    const beltModal = document.getElementById("beltModal");
const beltMemberName =
  document.getElementById("beltMemberName");
const beltLevelSelect =
  document.getElementById("beltLevelSelect");
const beltAwardedDate =
  document.getElementById("beltAwardedDate");
const beltAwardedBy =
  document.getElementById("beltAwardedBy");
const beltNote =
  document.getElementById("beltNote");
const beltModalError =
  document.getElementById("beltModalError");
const cancelBeltButton =
  document.getElementById("cancelBeltButton");
const saveBeltButton =
  document.getElementById("saveBeltButton");

let selectedBeltMemberId = null;

    let adminKey = "";
    let overviewData = null;

    function formatTime(timeValue) {
      if (!timeValue) {
        return "-";
      }

      return String(timeValue).slice(0, 5);
    }

    function formatCheckinTime(dateValue) {
      if (!dateValue) {
        return "-";
      }

      return new Intl.DateTimeFormat("th-TH", {
        hour: "2-digit",
        minute: "2-digit",
        timeZone: "Asia/Bangkok"
      }).format(new Date(dateValue));
    }

    function getMemberName(member) {
      return (
        member.nickname ||
        member.full_name ||
        member.display_name ||
        "ไม่ระบุชื่อ"
      );
    }
function formatBeltDate(dateValue) {
  if (!dateValue) {
    return "";
  }

  return new Intl.DateTimeFormat("th-TH", {
    day: "numeric",
    month: "short",
    year: "numeric",
    timeZone: "Asia/Bangkok"
  }).format(new Date(`${dateValue}T12:00:00+07:00`));
}
    function getCheckinMethod(method) {
      if (method === "teacher") {
        return "ครูเช็กให้";
      }

      if (method === "manual") {
        return "เพิ่มย้อนหลัง";
      }

      return "นักเรียนเช็กเอง";
    }

    async function loadOverview() {
      content.className = "loading";
      content.textContent = "กำลังโหลดข้อมูล...";

      refreshButton.disabled = true;
      loginError.textContent = "";

      try {
        const response = await fetch("/api/admin-overview", {
          method: "GET",
          headers: {
            "x-admin-key": adminKey
          }
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.error ||
            "ไม่สามารถโหลดข้อมูล Admin ได้"
          );
        }

        overviewData = data;
renderClassOptions();
        loginArea.style.display = "none";
        adminArea.style.display = "block";

        document.getElementById("dateText").textContent =
          `รายชื่อเข้าเรียนประจำวันที่ ${new Intl.DateTimeFormat(
            "th-TH",
            {
              dateStyle: "long",
              timeZone: "Asia/Bangkok"
            }
          ).format(new Date(`${data.date}T12:00:00+07:00`))}`;
function renderClassOptions() {
  newClassSelect.innerHTML = "";

  const classes = overviewData.classes || [];

  if (!classes.length) {
    const option = document.createElement("option");
    option.value = "";
    option.textContent = "ยังไม่มีประเภทคลาส";
    newClassSelect.appendChild(option);
    return;
  }

  classes.forEach((classItem) => {
    const option = document.createElement("option");

    option.value = String(classItem.id);
    option.textContent = classItem.name;

    newClassSelect.appendChild(option);
  });
}
        renderSessionOptions();

      } catch (error) {
        adminArea.style.display = "none";
        loginArea.style.display = "block";
        loginError.textContent = error.message;
        sessionStorage.removeItem("gambitAdminKey");
      } finally {
        refreshButton.disabled = false;
        loginButton.disabled = false;
        loginButton.textContent = "เข้าสู่ระบบ";
      }
    }

    function renderSessionOptions() {
      sessionSelect.innerHTML = "";

      if (!overviewData.sessions.length) {
        sessionSelect.innerHTML =
          `<option value="">วันนี้ยังไม่มีคลาสที่เปิดอยู่</option>`;

        renderEmptySession();
        return;
      }

      overviewData.sessions.forEach((session) => {
        const option = document.createElement("option");

        option.value = String(session.id);

        option.textContent =
          `${formatTime(session.start_time)} ` +
          `${session.classes?.name || "ไม่ระบุชื่อคลาส"}`;

        sessionSelect.appendChild(option);
      });

      renderSelectedSession();
    }

    function renderEmptySession() {
      document.getElementById("sessionTitle").textContent =
        "วันนี้ยังไม่มีคลาสที่เปิดอยู่";

      document.getElementById("sessionTime").textContent = "";

      document.getElementById("totalCount").textContent = "0";
      document.getElementById("checkedCount").textContent = "0";
      document.getElementById("remainingCount").textContent = "0";

      content.className = "empty";
      content.textContent =
        "กรุณาสร้างหรือเปิดคลาสก่อนตรวจสอบรายชื่อ";
    }
async function teacherCheckIn(sessionId, memberId, button) {
  const member = overviewData.members.find(
    (item) => item.id === memberId
  );

  const memberName = member
    ? getMemberName(member)
    : "นักเรียน";

  const confirmed = window.confirm(
    `ยืนยันเช็กชื่อให้ ${memberName} ใช่หรือไม่?`
  );

  if (!confirmed) {
    return;
  }

  button.disabled = true;
  button.textContent = "กำลังบันทึก...";

  try {
    const response = await fetch("/api/teacher-checkin", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": adminKey
      },
      body: JSON.stringify({
        sessionId,
        memberId
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "ครูเช็กชื่อไม่สำเร็จ"
      );
    }

    await loadOverview();

  } catch (error) {
    window.alert(error.message);

    button.disabled = false;
    button.textContent = "ครูเช็กให้";
  }
}
   function getThailandDateInputValue() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Bangkok",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());
}

function openBeltModal(member) {
  selectedBeltMemberId = member.id;

  beltMemberName.textContent =
    `นักเรียน: ${getMemberName(member)}`;

  beltLevelSelect.innerHTML = "";

  const beltLevels = overviewData.beltLevels || [];

  beltLevels.forEach((belt) => {
    const option = document.createElement("option");

    option.value = String(belt.id);
    option.textContent = belt.name_th;

    if (
      member.current_belt &&
      member.current_belt.belt_level_id === belt.id
    ) {
      option.selected = true;
    }

    beltLevelSelect.appendChild(option);
  });

  beltAwardedDate.value = getThailandDateInputValue();
  beltAwardedBy.value = "Coach";
  beltNote.value = "";
  beltModalError.textContent = "";

  saveBeltButton.disabled = false;
  saveBeltButton.textContent = "บันทึกการเปลี่ยนสาย";

  beltModal.classList.add("open");
}

function closeBeltModal() {
  beltModal.classList.remove("open");
  selectedBeltMemberId = null;
  beltModalError.textContent = "";
}

async function saveBeltChange() {
  const beltLevelId = Number(beltLevelSelect.value);
  const awardedDate = beltAwardedDate.value;

  if (!selectedBeltMemberId) {
    beltModalError.textContent =
      "ไม่พบข้อมูลนักเรียน";
    return;
  }

  if (!beltLevelId) {
    beltModalError.textContent =
      "กรุณาเลือกสาย";
    return;
  }

  if (!awardedDate) {
    beltModalError.textContent =
      "กรุณาเลือกวันที่ได้รับสาย";
    return;
  }

  saveBeltButton.disabled = true;
  saveBeltButton.textContent = "กำลังบันทึก...";
  beltModalError.textContent = "";

  try {
    const response = await fetch("/api/update-belt", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": adminKey
      },
      body: JSON.stringify({
        memberId: selectedBeltMemberId,
        beltLevelId,
        awardedDate,
        awardedBy: beltAwardedBy.value.trim(),
        note: beltNote.value.trim()
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      const details = data.details
        ? `\n${
            typeof data.details === "string"
              ? data.details
              : JSON.stringify(data.details)
          }`
        : "";

      throw new Error(
        (data.error || "เปลี่ยนสายไม่สำเร็จ") +
        details
      );
    }

    closeBeltModal();
    await loadOverview();

  } catch (error) {
    beltModalError.textContent = error.message;

    saveBeltButton.disabled = false;
    saveBeltButton.textContent =
      "บันทึกการเปลี่ยนสาย";
  }
}
function renderSelectedSession() {
      const sessionId = Number(sessionSelect.value);

      const session = overviewData.sessions.find(
        (item) => item.id === sessionId
      );

      if (!session) {
        renderEmptySession();
        return;
      }

      const sessionAttendance = overviewData.attendance.filter(
        (record) => record.session_id === sessionId
      );

      const attendanceByMember = new Map(
        sessionAttendance.map((record) => [
          record.member_id,
          record
        ])
      );

      const checkedCount = sessionAttendance.length;
      const totalCount = overviewData.members.length;
      const remainingCount = Math.max(
        totalCount - checkedCount,
        0
      );

      document.getElementById("sessionTitle").textContent =
        session.classes?.name || "ไม่ระบุชื่อคลาส";

      document.getElementById("sessionTime").textContent =
        `${formatTime(session.start_time)}–` +
        `${formatTime(session.end_time)} น.`;

      document.getElementById("totalCount").textContent =
        String(totalCount);

      document.getElementById("checkedCount").textContent =
        String(checkedCount);

      document.getElementById("remainingCount").textContent =
        String(remainingCount);

      if (!overviewData.members.length) {
        content.className = "empty";
        content.textContent = "ยังไม่มีสมาชิกในระบบ";
        return;
      }

      const sortedMembers = [...overviewData.members].sort(
        (first, second) => {
          const firstChecked =
            attendanceByMember.has(first.id);

          const secondChecked =
            attendanceByMember.has(second.id);

          if (firstChecked !== secondChecked) {
            return firstChecked ? -1 : 1;
          }

          return getMemberName(first).localeCompare(
            getMemberName(second),
            "th"
          );
        }
      );

      content.className = "member-list";

async function createSession() {
  const classId = Number(newClassSelect.value);
  const startTime = newStartTime.value;
  const endTime = newEndTime.value;

  if (!classId) {
    createSessionError.textContent =
      "กรุณาเลือกประเภทคลาส";
    return;
  }

  if (!startTime || !endTime) {
    createSessionError.textContent =
      "กรุณาระบุเวลาเริ่มและเวลาสิ้นสุด";
    return;
  }

  createSessionButton.disabled = true;
  createSessionButton.textContent = "กำลังเปิดคลาส...";
  createSessionError.textContent = "";

  try {
    const response = await fetch("/api/create-session", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": adminKey
      },
      body: JSON.stringify({
        classId,
        startTime,
        endTime,
        note: newSessionNote.value.trim()
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      const details = data.details
        ? `\n${
            typeof data.details === "string"
              ? data.details
              : JSON.stringify(data.details)
          }`
        : "";

      throw new Error(
        (data.error || "เปิดคลาสไม่สำเร็จ") + details
      );
    }

    newSessionNote.value = "";

    await loadOverview();

  } catch (error) {
    createSessionError.textContent = error.message;
  } finally {
    createSessionButton.disabled = false;
    createSessionButton.textContent = "เปิดคลาสวันนี้";
  }
}
    async function login() {
      const value = adminKeyInput.value.trim();

      if (!value) {
        loginError.textContent = "กรุณากรอกรหัส Admin";
        return;
      }

      adminKey = value;

      loginButton.disabled = true;
      loginButton.textContent = "กำลังตรวจสอบ...";

      sessionStorage.setItem(
        "gambitAdminKey",
        adminKey
      );

      await loadOverview();
    }

    loginButton.addEventListener("click", login);

    adminKeyInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        login();
      }
    });

    refreshButton.addEventListener(
      "click",
      loadOverview
    );

    sessionSelect.addEventListener(
      "change",
      renderSelectedSession
    );

    logoutButton.addEventListener("click", () => {
      sessionStorage.removeItem("gambitAdminKey");
      adminKey = "";
      adminKeyInput.value = "";

      adminArea.style.display = "none";
      loginArea.style.display = "block";
    });
