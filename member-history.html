<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ประวัติสมาชิก | GAMBIT JIUJITSU</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f5f7;color:#181818;margin:0}.page{max-width:850px;margin:auto;padding:24px 16px}.card{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 4px 18px #0001}button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}.back{background:#111;color:white}.tabs{display:flex;gap:10px}.tabs button{background:#eee}.tabs button.active{background:#111;color:white}.entry{padding:16px 0;border-bottom:1px solid #eee}.muted{color:#666;font-size:13px;line-height:1.8}.belt{height:20px;width:125px;border:1px solid #999;border-radius:4px;display:inline-flex;overflow:hidden;vertical-align:middle;margin-right:8px}.belt .body{flex:1}.belt .bar{width:30px;background:#111;display:flex;align-items:center;justify-content:space-evenly}.belt .stripe{height:13px;width:3px;background:#777}.belt .stripe.on{background:white}.hidden{display:none}#status{color:#b42318}
</style></head><body><main class="page"><button class="back" id="back">← กลับหน้าสมาชิก</button><h1>ประวัติสมาชิก</h1><p id="memberLabel">กำลังโหลด...</p><div class="card"><div class="tabs"><button id="paymentsTab" class="active">💳 สมัคร / ต่ออายุ / ชำระเงิน</button><button id="beltsTab">🥋 ประวัติสีสาย</button></div><p id="status"></p><section id="payments"></section><section id="belts" class="hidden"></section></div></main><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const memberId=Number(new URLSearchParams(location.search).get('memberId'));
$('back').onclick=()=>location.href='members.html';
function tab(type){$('payments').classList.toggle('hidden',type!=='payments');$('belts').classList.toggle('hidden',type!=='belts');$('paymentsTab').classList.toggle('active',type==='payments');$('beltsTab').classList.toggle('active',type==='belts');}
$('paymentsTab').onclick=()=>tab('payments');$('beltsTab').onclick=()=>tab('belts');
function date(s){if(!s)return '-';const d=new Date(s.length===10?s+'T00:00:00+07:00':s);return isNaN(d)?'-':d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Bangkok'});}
const plans={drop_in:'Drop-in 1 ครั้ง',adult_monthly:'Adult Monthly',kids_monthly:'Kids Monthly',class_pass_4:'Class Pass 4 ครั้ง',class_pass_8:'Class Pass 8 ครั้ง',class_pass_12:'Class Pass 12 ครั้ง',private:'Private'};
function beltVisual(code,count){const colors={white:'#fff',blue:'#2563eb',purple:'#7e22ce',brown:'#78350f',black:'#111',gray:'#808080',yellow:'#facc15',orange:'#f97316',green:'#22c55e'};const key=String(code||'white');const parts=key.split('_');const base=colors[parts[0]]||'#ddd';const second=parts[1]&&colors[parts[1]];const bg=second?`linear-gradient(to bottom,${base} 0 28%,${second} 28% 72%,${base} 72% 100%)`:base;const n=Math.max(0,Math.min(4,Number(count)||0));return `<span class="belt" aria-label="${esc(key)} ${n} ขีด"><span class="body" style="background:${bg}"></span><span class="bar">${Array.from({length:4},(_,i)=>`<i class="stripe ${i<n?'on':''}"></i>`).join('')}</span></span>`;}
async function load(){const key=sessionStorage.getItem('gambitAdminKey');const role=sessionStorage.getItem('gambitRole');if(!key||!['owner','coach'].includes(role)||!Number.isInteger(memberId)||memberId<=0){$('status').textContent='ไม่มีสิทธิ์เข้าถึง หรือรหัสสมาชิกไม่ถูกต้อง';return;}
try{const res=await fetch('/api/admin-dashboard',{headers:{'x-admin-key':key}});const data=await res.json();if(!res.ok||!data.success)throw new Error(data.error||'โหลดไม่สำเร็จ');const member=(data.members||[]).find(m=>Number(m.id)===memberId);if(!member)throw new Error('ไม่พบสมาชิก');$('memberLabel').textContent=`${member.nickname||member.display_name||'สมาชิก'} · GJ-${String(member.id).padStart(4,'0')}`;
const payments=(data.paymentHistory||[]).filter(x=>Number(x.memberId)===memberId);$('payments').innerHTML=payments.length?payments.map(x=>`<article class="entry"><strong>${esc(x.type==='registration'?'สมัครสมาชิกครั้งแรก':'ต่ออายุสมาชิก')} · ${esc(plans[x.membershipPlan]||x.membershipPlan||'-')}</strong><div class="muted">${Number(x.amount||0).toLocaleString('th-TH')} บาท · ${esc(x.paymentMethod==='cash'?'เงินสด':x.paymentMethod==='transfer'?'เงินโอน':'-')}<br>${date(x.approvedAt)}</div></article>`).join(''):'<p class="muted">ยังไม่มีประวัติการชำระเงิน</p>';
const belts=(data.beltHistory||[]).filter(x=>Number(x.member_id)===memberId);$('belts').innerHTML=belts.length?belts.map(x=>{const b=x.belt_levels||{};return `<article class="entry">${beltVisual(b.code,x.stripe_count)}<strong>${esc(b.name_th||b.code||'ไม่ระบุสาย')}</strong><div class="muted">Rank Bar ${Math.max(0,Math.min(4,Number(x.stripe_count)||0))} ขีด · ${date(x.awarded_date)}<br>${x.awarded_by?'ผู้มอบสาย: '+esc(x.awarded_by)+'<br>':''}${x.note?'หมายเหตุ: '+esc(x.note):''}</div></article>`}).join(''):'<p class="muted">ยังไม่มีประวัติระดับสาย</p>';
}catch(e){$('status').textContent=e.message||'เกิดข้อผิดพลาด';}}
load();</script></body></html>
