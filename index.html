<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GAMBIT JIUJITSU Check-in</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #181818;
    }

    .card {
      width: 100%;
      max-width: 520px;
      margin: 30px auto;
      padding: 28px 22px;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .logo {
  margin-bottom: 8px;
}

.main-logo {
  width: 90px;
  height: 90px;
  object-fit: contain;
  display: block;
  margin: 0 auto;
}
    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: #666666;
    }

    .profile {
      display: none;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      padding: 14px;
      background: #f7f7f7;
      border-radius: 14px;
      text-align: left;
    }

    .profile img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      background: #dddddd;
    }

    .profile-name {
      margin: 0;
      font-size: 18px;
      font-weight: bold;
    }

    .profile-label {
      margin: 4px 0 0;
      font-size: 13px;
      color: #777777;
    }

    #status {
      min-height: 24px;
      margin: 18px 0;
      line-height: 1.6;
      color: #555555;
      white-space: pre-line;
    }

  

    #checkinButton:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .success {
      color: #138a40 !important;
      font-weight: bold;
    }

    .error {
      color: #c62828 !important;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #edf9f1;
      border-radius: 14px;
    }

    .result-icon {
      font-size: 42px;
    }

    .result h2 {
      margin: 8px 0;
      color: #138a40;
    }

    .result p {
      margin: 6px 0;
    }
    /* =========================
   GAMBIT MEMBER CARD
========================= */

.member-card {
  position: relative;
  overflow: hidden;

  display: none;
 grid-template-columns: 1.2fr 0.9fr;

  width: 100%;
  margin: 22px 0;
  padding: 24px;

  color: #ffffff;
  text-align: left;

  background:
    linear-gradient(
      135deg,
      #080808 0%,
      #111111 55%,
      #050505 100%
    );

  border-radius: 22px;

  box-shadow:
    0 12px 28px rgba(0, 0, 0, 0.22);
}

.member-main {
  position: relative;
  z-index: 2;
  min-width: 0;
}

.member-heading {
  display: flex;
  align-items: center;
  gap: 14px;
}

.member-photo {
  width: 76px;
  height: 76px;

  flex-shrink: 0;

  object-fit: cover;
  border-radius: 50%;

  border: 3px solid #ffffff;
}

.member-name-area {
  min-width: 0;
}

.member-name-area h2 {
  margin: 0 0 8px;

  color: #ffffff;
  font-size: 26px;
  line-height: 1.1;

  overflow: hidden;
  text-overflow: ellipsis;
}

.member-status-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;

  font-size: 13px;
}

.status-badge {
  display: inline-block;

  padding: 5px 9px;

  border-radius: 7px;

  background: #159447;
  color: #ffffff;

  font-size: 11px;
  font-weight: 700;
}

.line-member {
  color: #cccccc;
}

.member-info {
  margin-top: 24px;
}

.member-info-row {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 12px;

  min-height: 38px;
  padding: 9px 0;

  align-items: center;

  border-bottom:
    1px solid rgba(255, 255, 255, 0.13);
}

.member-info-row span {
  color: #bcbcbc;
  font-size: 13px;
}

.member-info-row strong {
  color: #ffffff;
  font-size: 13px;
  font-weight: 600;
}

.package-row {
  border-bottom: 0;
}

.package-row span {
  color: #ef2b2d;
  font-weight: 700;
}


/* CLASS PASS RIGHT SIDE */

.class-pass-summary {
  position: relative;
  z-index: 1;

  min-width: 0;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding-left: 22px;

  border-left:
    1px solid rgba(255, 255, 255, 0.25);
}

.card-watermark {
  position: absolute;

  width: 310px;
  height: 310px;

  right: -95px;
  top: 50%;

  transform: translateY(-50%);

  object-fit: cover;
  border-radius: 50%;

  opacity: 0.09;

  filter:
    grayscale(1)
    contrast(1.8)
    brightness(0.55);

  mix-blend-mode: screen;

  pointer-events: none;
}

.class-pass-title {
  position: relative;
  z-index: 2;

  font-size: 20px;
  font-weight: 700;
}

.class-pass-number {
  position: relative;
  z-index: 2;

  display: flex;
  align-items: baseline;
  justify-content: center;

  gap: 10px;

  margin-top: 4px;
}

.class-pass-number strong,
.class-pass-number span {
  font-size: 54px;
  line-height: 1;
  font-weight: 800;
}

#cardRemainingSessions {
  color: #ef252d;
  font-size: 64px;
}

.class-pass-summary small {
  position: relative;
  z-index: 2;

  margin-top: 10px;

  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
}


/* RED DETAIL */

.member-card::after {
  content: "";

  position: absolute;

  right: -45px;
  bottom: -70px;

  width: 210px;
  height: 120px;

  background:
    linear-gradient(
      135deg,
      transparent 25%,
      rgba(239, 43, 45, 0.85)
    );

  transform: rotate(-12deg);

  opacity: 0.7;
}


/* MOBILE */

@media (max-width: 430px) {

 .member-card {
  grid-template-columns: 1.15fr 0.95fr;

  min-height: 360px;
  padding: 26px;

  border-radius: 24px;
}

  .member-photo {
    width: 62px;
    height: 62px;
  }

  .member-name-area h2 {
    font-size: 22px;
  }

 .member-info-row {
  grid-template-columns: 112px 1fr;
}
.member-info-row strong {
  white-space: nowrap;
}

  .class-pass-summary {
    padding-left: 12px;
  }

  .class-pass-title {
    font-size: 15px;
  }

  .class-pass-number strong,
  .class-pass-number span {
    font-size: 30px;
  }

  #cardRemainingSessions {
    font-size: 40px;
  }
}
  /* =========================
   MEMBER ACTIONS
========================= */

.member-actions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 18px;
}

.member-actions .action-card {
  width: 100%;
  min-height: 92px;

  display: flex;
  align-items: center;
  gap: 12px;

  padding: 15px;

  border: 1px solid #e1e1e1;
  border-radius: 16px;

  background: #ffffff;
  color: #181818;

  text-align: left;
  cursor: pointer;

  box-shadow:
    0 5px 16px rgba(0, 0, 0, 0.07);
}

.member-actions .action-card:hover {
  transform: translateY(-1px);
}

.action-icon {
  width: 38px;
  height: 38px;
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 10px;

  background: #111111;
  color: #ffffff;

  font-size: 20px;
  font-weight: 800;
}

.action-text {
  min-width: 0;
}

.action-text strong {
  display: block;
  font-size: 14px;
  line-height: 1.35;
}

.action-text small {
  display: block;
  margin-top: 4px;

  color: #888888;
  font-size: 11px;
}


/* ปุ่ม Check-in เน้นแดงเล็กน้อย */

#checkinButton .action-icon {
  background: #e3262e;
}


@media (max-width: 380px) {
  .member-actions {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">
  <img
    src="images/logo.jpg"
    alt="GAMBIT JIUJITSU"
    class="main-logo"
  >
</div>

    <h1>GAMBIT JIUJITSU</h1>
    <p class="subtitle">ระบบเช็กชื่อเข้าเรียน</p>

   <section id="profile" class="member-card">

  <div class="member-main">

    <div class="member-heading">

      <img
        id="picture"
        class="member-photo"
        alt="รูปโปรไฟล์ LINE"
      >

      <div class="member-name-area">
        <h2 id="displayName">-</h2>

        <div class="member-status-row">
          <span
            id="memberStatusBadge"
            class="status-badge"
          >
            ACTIVE
          </span>

          <span class="line-member">
            สมาชิก LINE
          </span>
        </div>
      </div>

    </div>


    <div class="member-info">

      <div class="member-info-row">
        <span>รหัสสมาชิก</span>
        <strong id="memberCode">-</strong>
      </div>

      <div class="member-info-row">
        <span>กลุ่มสมาชิก</span>
        <strong id="memberGroup">-</strong>
      </div>

      <div class="member-info-row">
        <span>วันที่เริ่มต้น</span>
        <strong id="membershipStart">-</strong>
      </div>

      <div class="member-info-row">
        <span>วันหมดอายุ</span>
        <strong id="membershipExpiry">-</strong>
      </div>

      <div class="member-info-row package-row">
        <span>แพ็กเกจ</span>
        <strong id="membershipPlan">-</strong>
      </div>

    </div>

  </div>


  <div
    id="classPassSummary"
    class="class-pass-summary"
  >

    <img
  src="images/logo.jpg"
  class="card-watermark"
  alt=""
>
    <span class="class-pass-title">
      Class Pass
    </span>

    <div class="class-pass-number">

      <strong id="cardRemainingSessions">
        -
      </strong>

      <span>/</span>

      <strong id="cardTotalSessions">
        -
      </strong>

    </div>

    <small>ครั้ง</small>

  </div>

</section>

    <p id="status">กำลังเชื่อมต่อกับ LINE...</p>
<section id="memberMenu" class="member-actions">

  <button
    id="checkinButton"
    class="action-card"
    type="button"
  >
    <span class="action-icon">✓</span>

    <span class="action-text">
      <strong>เช็กชื่อเข้าเรียน</strong>
      <small>Check-in Class</small>
    </span>
  </button>


  <button
    id="historyButton"
    class="action-card"
    type="button"
  >
    <span class="action-icon">↻</span>

    <span class="action-text">
      <strong>ประวัติการเข้าเรียน</strong>
      <small>Class History</small>
    </span>
  </button>


  <button
    id="renewButton"
    class="action-card"
    type="button"
  >
    <span class="action-icon">▣</span>

    <span class="action-text">
      <strong>ต่ออายุสมาชิก</strong>
      <small>Renew Membership</small>
    </span>
  </button>


  <button
    id="paymentHistoryButton"
    class="action-card"
    type="button"
  >
    <span class="action-icon">฿</span>

    <span class="action-text">
      <strong>ประวัติการชำระเงิน</strong>
      <small>Payment History</small>
    </span>
  </button>

</section>
    <section id="result" class="result">
      <div class="result-icon">✅</div>
    <h2 id="resultTitle">เช็คชื่อสำเร็จ</h2>
      <p id="resultName"></p>
      <p id="resultCount"></p>
      <p id="resultMembership"></p>
      <p id="resultRemaining"></p>
      <p id="resultTime"></p>
    </section>
  </main>

  <script>
    const LIFF_ID = "2010879060-PKqAwFmt";

    const statusElement = document.getElementById("status");
    const profileElement = document.getElementById("profile");
    const pictureElement = document.getElementById("picture");
    const displayNameElement = document.getElementById("displayName");
    const checkinButton = document.getElementById("checkinButton");
    const resultElement = document.getElementById("result");
    const memberMenu = document.getElementById("memberMenu");

    function showError(message) {
      statusElement.className = "error";
      statusElement.textContent = message;
      checkinButton.disabled = false;
    }

    function formatThaiDateTime(dateValue) {
      const date = new Date(dateValue);

      return new Intl.DateTimeFormat("th-TH", {
        dateStyle: "medium",
        timeStyle: "short",
        timeZone: "Asia/Bangkok"
      }).format(date);
    }

    async function initializeLiff() {
      try {
        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login({
            redirectUri: window.location.href
          });
          return;
        }

        const idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error(
            "ไม่สามารถรับ LINE ID token ได้ กรุณาตรวจสอบว่า LIFF เปิด scope openid แล้ว"
          );
        }

        const profile = await liff.getProfile();
        const lineUserId = profile.userId;

        displayNameElement.textContent = profile.displayName;

        if (profile.pictureUrl) {
          pictureElement.src = profile.pictureUrl;
        } else {
          pictureElement.style.display = "none";
        }
statusElement.className = "";
statusElement.textContent =
  "กำลังโหลดข้อมูลสมาชิก...";

await loadMemberProfile(idToken);

checkinButton.style.display = "flex";

       checkinButton.addEventListener("click", checkIn);

      } catch (error) {
  console.error(error);
  showError("เกิดข้อผิดพลาด: " + error.message);
}
}


function formatThaiDate(dateValue) {
  if (!dateValue) {
    return "-";
  }

  return new Intl.DateTimeFormat(
    "th-TH",
    {
      day: "2-digit",
      month: "short",
      year: "numeric",
      timeZone: "Asia/Bangkok"
    }
  ).format(
    new Date(`${dateValue}T00:00:00`)
  );
}


function formatMembershipPlan(plan) {
  const plans = {
    adult_monthly:
      "Adult Monthly",

    kids_monthly:
      "Kids Monthly",

    private:
      "Private",

    drop_in:
      "Drop In",

    class_pass_4:
      "Class Pass 4 ครั้ง",

    class_pass_8:
      "Class Pass 8 ครั้ง",

    class_pass_12:
      "Class Pass 12 ครั้ง"
  };

  return plans[plan] || plan || "-";
}
    async function loadMemberProfile(idToken) {
  const response = await fetch("/api/checkin", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      mode: "profile",
      idToken
    })
  });
  const data = await response.json();

  if (!response.ok || !data.success) {
    throw new Error(
      data.error || "โหลดข้อมูลสมาชิกไม่สำเร็จ"
    );
  }


  // =========================
  // ยังไม่เคยสมัคร
  // =========================

  if (data.state === "not_registered") {
    window.location.href = "register.html";
    return;
  }


  // =========================
  // สมัครแล้ว รออนุมัติ
  // =========================

  if (data.state === "pending") {
    profileElement.style.display = "none";
    memberMenu.style.display = "none";

    statusElement.className = "";
    statusElement.textContent =
      "คำขอสมัครสมาชิกของคุณอยู่ระหว่างการตรวจสอบ\nกรุณารอการอนุมัติจากทางยิม";

    return;
  }


  // =========================
  // MEMBER
  // =========================

  if (data.state !== "member") {
    throw new Error(
      "ไม่สามารถตรวจสอบสถานะสมาชิกได้"
    );
  }

  const member = data.member;


  // รหัสสมาชิก
  document.getElementById(
    "memberCode"
  ).textContent =
    member.memberCode || "-";


  // สถานะ
  const statusBadge =
    document.getElementById(
      "memberStatusBadge"
    );

  statusBadge.textContent =
    String(
      member.memberStatus || "inactive"
    ).toUpperCase();


  // วันเริ่ม
  document.getElementById(
    "membershipStart"
  ).textContent =
    formatThaiDate(
      member.membershipStartDate
    );


  // วันหมดอายุ
  document.getElementById(
    "membershipExpiry"
  ).textContent =
    formatThaiDate(
      member.membershipExpiryDate
    );


  // Package
  const plan =
    String(
      member.membershipPlan || ""
    );

  document.getElementById(
    "membershipPlan"
  ).textContent =
    formatMembershipPlan(plan);


  // Class Pass
  const isClassPass =
    plan.startsWith("class_pass_");

  const classPassSummary =
    document.getElementById(
      "classPassSummary"
    );

  if (isClassPass) {
    classPassSummary.style.display =
      "flex";

    document.getElementById(
      "cardRemainingSessions"
    ).textContent =
      member.remainingSessions ?? 0;

    document.getElementById(
      "cardTotalSessions"
    ).textContent =
      member.totalSessions ?? 0;

  } else {
    classPassSummary.style.display =
      "none";
  }


  profileElement.style.display = "grid";

  statusElement.className = "";
  statusElement.textContent =
    "พร้อมแล้ว กดเช็กชื่อเข้าเรียนได้เลย";
}
    async function checkIn() {
      checkinButton.disabled = true;
      checkinButton.textContent = "กำลังเช็กชื่อ...";

      statusElement.className = "";
      statusElement.textContent = "กำลังตรวจสอบข้อมูลกับ LINE...";

      try {
        const idToken = liff.getIDToken();
const decodedToken = liff.getDecodedIDToken();

if (!idToken || !decodedToken) {
  throw new Error("ไม่พบข้อมูลเข้าสู่ระบบ LINE");
}

const currentTime = Math.floor(Date.now() / 1000);

if (!decodedToken.exp || decodedToken.exp <= currentTime + 30) {
  liff.logout();

  liff.login({
    redirectUri: window.location.href
  });

  return;
}
        const response = await fetch("/api/checkin", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            idToken: idToken
          })
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error(
            "เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง กรุณาตรวจสอบการ Deploy"
          );
        }

        if (!response.ok || !data.success) {
          const details = data.details
            ? `\n${typeof data.details === "string"
              ? data.details
              : JSON.stringify(data.details)}`
            : "";

          throw new Error(
            (data.error || "เช็กชื่อไม่สำเร็จ") + details
          );
        }

        statusElement.className = "success";

if (data.alreadyCheckedIn) {
  statusElement.textContent =
    "วันนี้คุณเช็กชื่อเรียบร้อยแล้ว";

  document.getElementById("resultTitle").textContent =
    "วันนี้เช็กชื่อแล้ว";
} else {
  statusElement.textContent =
    "บันทึกข้อมูลเรียบร้อยแล้ว";

  document.getElementById("resultTitle").textContent =
    "เช็กชื่อสำเร็จ";
}

        document.getElementById("resultName").textContent =
          `ชื่อ: ${data.displayName}`;

        document.getElementById("resultCount").textContent =
          `เข้าเรียนสะสม: ${data.checkinCount} ครั้ง`;
          const resultMembership =
  document.getElementById("resultMembership");

const resultRemaining =
  document.getElementById("resultRemaining");

const isClassPass =
  String(data.membershipPlan || "")
    .startsWith("class_pass_");

if (isClassPass) {
  resultMembership.textContent =
    `แพ็กเกจ: Class Pass ${data.totalSessions} ครั้ง`;

  resultRemaining.textContent =
    `สิทธิ์คงเหลือ: ${data.remainingSessions} / ${data.totalSessions} ครั้ง`;

  if (Number(data.remainingSessions) <= 2) {
    resultRemaining.style.fontWeight = "bold";
  }

  if (Number(data.remainingSessions) === 0) {
    resultRemaining.textContent =
      "สิทธิ์ Class Pass ใช้ครบแล้ว กรุณาต่ออายุสมาชิก";
  }
} else {
  resultMembership.textContent = "";
  resultRemaining.textContent = "";
}

        document.getElementById("resultTime").textContent =
          `เวลา: ${formatThaiDateTime(data.checkedInAt)}`;

        resultElement.style.display = "block";
        checkinButton.style.display = "none";
       

      } catch (error) {
        console.error(error);

        showError(
          "เช็กชื่อไม่สำเร็จ\n" + error.message
        );

        checkinButton.textContent = "ลองเช็กชื่ออีกครั้ง";
      }
    }

    initializeLiff();
  </script>
</body>
</html>
